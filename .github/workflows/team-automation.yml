name: Team · Automation Toggle

on:
  workflow_dispatch:
    inputs:
      enabled:
        description: 'Turn the unattended daily meeting + intake sweep on or off'
        required: true
        type: choice
        options: [on, off]

permissions:
  contents: write

concurrency:
  group: team-state
  cancel-in-progress: false

jobs:
  toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Write the automation flag
        env:
          ENABLED: ${{ inputs.enabled }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p team/state
          node -e "
            const fs = require('fs');
            const enabled = process.env.ENABLED === 'on';
            fs.writeFileSync(
              'team/state/automation.json',
              JSON.stringify({ enabled, updatedAt: new Date().toISOString(), updatedBy: process.env.ACTOR }, null, 2) + '\n',
            );
          "

      - name: Commit and push
        run: |
          bash scripts/team/commit-state.sh "team(automation): turn unattended runs ${{ inputs.enabled }}" team/state/automation.json
