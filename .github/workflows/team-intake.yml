name: Team · Intake

on:
  schedule:
    - cron: '0 5 * * *' # sweep 30 minutes before the daily meeting
  workflow_dispatch:
  repository_dispatch:
    types: [beat-drop]

permissions:
  contents: write

concurrency:
  group: team-state
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEW_INTAKE_FILE: /tmp/new-intake.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install intake dependencies
        working-directory: scripts/team
        run: npm install --no-audit --no-fund

      - name: Poll Discord for beat drops
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_INTAKE_CHANNELS: ${{ vars.DISCORD_INTAKE_CHANNELS }}
        run: node scripts/team/intake-discord.mjs

      - name: Poll the artist mailbox
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
        run: node scripts/team/intake-imap.mjs

      - name: Adopt copyparty drops
        run: node scripts/team/intake-copyparty.mjs

      - name: Check for new material
        id: fresh
        run: |
          if [ -s "$NEW_INTAKE_FILE" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "ids=$(paste -sd, "$NEW_INTAKE_FILE")" >> "$GITHUB_OUTPUT"
            echo "New intake: $(paste -sd, "$NEW_INTAKE_FILE")"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No new material."
          fi

      - name: Set up Python
        if: steps.fresh.outputs.any == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install audio analysis tools
        if: steps.fresh.outputs.any == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install --quiet librosa numpy soundfile

      - name: Extract audio features
        if: steps.fresh.outputs.any == 'true'
        run: |
          while read -r id; do
            record="team/inbox/${id}.json"
            audio=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$record','utf8')).filename ?? '')")
            kind=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$record','utf8')).kind)")
            if [ "$kind" = "audio" ] && [ -n "$audio" ]; then
              python scripts/team/extract-features.py "$audio" "$record"
            fi
          done < "$NEW_INTAKE_FILE"

      - name: Install Claude Code
        if: steps.fresh.outputs.any == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Analyze new material (Aether / Hermes)
        if: steps.fresh.outputs.any == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TEAM_RUN: '1'
          NEW_INTAKE_IDS: ${{ steps.fresh.outputs.ids }}
        run: |
          claude -p "$(cat prompts/intake-analysis.md)" \
            --permission-mode acceptEdits \
            --allowedTools "Read,Glob,Grep,Write,Edit,Task" \
            --max-turns 80

      - name: Validate team state
        run: node scripts/team/validate-state.mjs

      - name: Commit and push
        run: |
          count=$([ -s "$NEW_INTAKE_FILE" ] && wc -l < "$NEW_INTAKE_FILE" || echo 0)
          bash scripts/team/commit-state.sh "team(intake): sweep, ${count// /} new item(s)"
